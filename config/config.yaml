# Ribo-seq config

# Sample sheet TSV (columns: Sample, Fastq)
samples: WORKDIR/config/samples.tsv

# Input FASTQ directory (single-end)
raw_data_dir: "/path/to/raw/fastqs"

# Output directory
results_dir: WORKDIR/results

# Optional references for future production rules
reference_fasta: "/path/to/reference/genome.fa"
reference_gtf: "/path/to/reference/annotation.gtf"

# Contaminant references used for sequential filtering
rrna_fasta: "/path/to/contaminants/rrna.fa"
trna_fasta: "/path/to/contaminants/trna.fa"
ncrna_fasta: "/path/to/contaminants/ncrna.fa"

# HPC env modules (placeholder values, adjust on cluster)
modules:
  cutadapt: "cutadapt"
  umi_tools: "umi_tools"
  fastqc: "fastqc"
  bowtie2: "bowtie2"
  star: "star"
  r: "R"
  multiqc: "multiqc"
