# Ribo-seq config

# Sample sheet TSV (columns: Sample, Fastq)
samples: WORKDIR/config/samples.tsv

# Input FASTQ directory (single-end)
raw_data_dir: "/path/to/raw/fastqs"

# Output directory
results_dir: WORKDIR/results

# HPC environment modules
tools: PIPELINE_HOME/resources/tools.yaml

# Contaminant references used for sequential filtering (from RNA Central)
rrna_fasta: "/data/khanlab3/gb_omics/resources/rnacentral/rRNA.fasta"
trna_fasta: "/data/khanlab3/gb_omics/resources/rnacentral/tRNA.fasta"
snrna_fasta: "/data/khanlab3/gb_omics/resources/rnacentral/snRNA.fasta"

# References for STAR build
# primary_assembly excludes alt/haplotype/patch contigs, reducing multimapping for short reads
reference_fasta: "/fdb/GENCODE/Gencode_human/release_45/GRCh38.primary_assembly.genome.fa"
reference_gtf: "/fdb/GENCODE/Gencode_human/release_45/gencode.v45.annotation.gtf"
transcript_fasta: "/fdb/GENCODE/Gencode_human/release_45/gencode.v45.transcripts.fa"
